services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pKapil1234"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - microservice-network

  eureka-server:
    build:
      context: "./EUREKA SERVER/EUREKA-SERVER"

    container_name: eureka-server
    restart: always

    ports:
      - "8761:8761"

    networks:
      - microservice-network

  auth-service:
    build:
      context: "./AUTH SERVICE/AUTH-SERVICE"

    container_name: auth-service
    restart: always

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/auth_service
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka

    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started

    networks:
      - microservice-network

  crud-service:
    build:
      context: "./CRUD SERVICE/CRUD-SERVICE"

    container_name: crud-service
    restart: always

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/crud_service
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka

    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started

    networks:
      - microservice-network

  api-gateway:
    build:
      context: "./API GATEWAY/API-GATEWAY"

    container_name: api-gateway
    restart: always

    ports:
      - "8080:8080"

    environment:
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka

    depends_on:
      - auth-service
      - crud-service
      - eureka-server

    networks:
      - microservice-network

volumes:
  mysql-data:

networks:
  microservice-network:
    driver: bridge